name: smart_hotkeys
description: Global desktop hotkeys with separate press and release callbacks, runtime registration and suspension.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.1
  flutter: '>=3.44.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  dbus: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.0
  riverpod_generator: ^4.0.0
  freezed: ^3.2.0
  json_serializable: ^6.11.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: SmartHotkeysPlugin
      macos:
        pluginClass: SmartHotkeysPlugin
      windows:
        pluginClass: SmartHotkeysPluginCApi
